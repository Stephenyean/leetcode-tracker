<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode Weekly Challenge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .progress { height: 25px; border-radius: 12px; }
        .username { font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="display-4">LeetCode Weekly Progress</h1>
            <p class="lead">Goal: 20 problems per week</p>
            <div id="last-updated" class="text-muted small"></div>
        </div>

        <div id="leaderboard" class="row justify-content-center">
            <!-- Stats will be injected here -->
            <div class="text-center">Loading progress...</div>
        </div>
    </div>

    <script>
        async function loadStats() {
            try {
                // Add timestamp to prevent caching
                const response = await fetch(`data/stats.json?t=${new Date().getTime()}`);
                const data = await response.json();
                const leaderboard = document.getElementById('leaderboard');
                leaderboard.innerHTML = '';

                let lastUpdated = '';

                Object.entries(data).forEach(([username, stats]) => {
                    // Use precise week_solved if available, otherwise fallback to baseline diff
                    const solved = (stats.week_solved !== undefined) 
                        ? stats.week_solved 
                        : (stats.current - stats.baseline);
                        
                    const goal = 20;
                    const percentage = Math.min(Math.round((solved / goal) * 100), 100);
                    const color = percentage >= 100 ? 'bg-success' : (percentage > 50 ? 'bg-info' : 'bg-warning');
                    
                    lastUpdated = stats.last_updated;

                    const card = `
                        <div class="col-md-8 mb-4">
                            <div class="card p-4">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="username">${username}</span>
                                    <span class="badge bg-dark">${solved} / ${goal} Solved (Current Week)</span>
                                </div>
                                <div class="progress mb-4">
                                    <div class="progress-bar ${color} progress-bar-striped progress-bar-animated" 
                                         role="progressbar" 
                                         style="width: ${percentage}%" 
                                         aria-valuenow="${percentage}" aria-valuemin="0" aria-valuemax="100">
                                         ${percentage}%
                                    </div>
                                </div>
                                
                                <div class="history-section mt-3">
                                    <h6 class="text-muted small text-uppercase">Weekly History (Problems Solved)</h6>
                                    <div class="d-flex justify-content-between text-center small">
                                        ${stats.history && stats.history.length > 0 ? stats.history.slice(-4).map(w => `
                                            <div class="px-2">
                                                <div class="fw-bold text-secondary">${w.solved}</div>
                                                <div class="text-muted" style="font-size: 0.75rem">Week ${w.week}</div>
                                            </div>
                                        `).join('') : '<span class="text-muted fst-italic">History will appear next week</span>'}
                                    </div>
                                </div>

                                <div class="text-end small text-muted mt-3">Total AC: ${stats.current}</div>
                            </div>
                        </div>
                    `;
                    leaderboard.innerHTML += card;
                });

                if (lastUpdated) {
                    document.getElementById('last-updated').innerText = `Last updated: ${lastUpdated}`;
                }
            } catch (e) {
                document.getElementById('leaderboard').innerHTML = '<div class="alert alert-danger">Failed to load stats. Check if data/stats.json exists.</div>';
            }
        }

        loadStats();
    </script>
</body>
</html>
